[project]
name = "backend"
version = "0.1.0"
description = "Aulas de C216"
authors = [
    {name = "Guilherme-O-Brito",email = "gui_o_brito@yahoo.com.br"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
package-mode = false


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "A",
    "F",
    "I",
    "UP",
    "B"
]
ignore = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "httpx2 (>=2.13.0,<3.0.0)"
]
