services:
  web:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    image: backend:1.0 
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    image: frontend:1.0 
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env

  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: backend_db
      POSTGRES_USER: backend_user
      POSTGRES_PASSWORD: test123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
