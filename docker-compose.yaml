services:
  web:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    container_name: FastApi
    image: lab:1.0 
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://dast_api:123ab@mariadb:3306/fast_api_db
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fast_api_db
      MYSQL_USER: dast_api
      MYSQL_PASSWORD: 123ab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
